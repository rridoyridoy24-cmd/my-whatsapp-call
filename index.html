<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keypad Direct Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b141a;
            color: #00ff66;
            font-family: sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .phone-frame {
            width: 100%; max-width: 380px; height: 100%; max-height: 700px;
            background-color: #121212; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,255,102,0.3);
            display: flex; flex-direction: column; overflow: hidden;
            border: 2px solid #00ff66; position: relative;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; background-color: #121212; z-index: 2;
        }

        .hidden { display: none !important; }

        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: #1f2c34; color: #fff; font-size: 15px; font-weight: bold;
        }

        /* কিবোর্ড দিয়ে ফোকাস হলে বর্ডার ও ব্যাকগ্রাউন্ড উজ্জ্বল হবে */
        .id-select {
            background: #2a3942; color: #00ff66; border: 2px solid #00ff66;
            padding: 6px 12px; border-radius: 6px; font-size: 14px; outline: none; cursor: pointer;
        }
        .id-select:focus { background: #005c4b; color: #fff; outline: 3px solid #fff; }

        .main-box {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #111b21; gap: 20px; padding: 20px; text-align: center;
        }

        /* কল করার বাটন - কিবোর্ড ফোকাস সাপোর্ট */
        .call-action-btn {
            background: #005c4b; color: #fff; border: 2px solid #00ff66;
            padding: 18px 35px; font-size: 20px; font-weight: bold; border-radius: 12px;
            cursor: pointer; width: 85%;
        }
        .call-action-btn:focus, .call-action-btn:hover {
            background: #007e66; outline: 4px solid #fff; transform: scale(1.02);
        }

        .call-screen {
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 25px; text-align: center; position: absolute; z-index: 10; background: #000;
        }

        #remoteVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #localVideo { position: absolute; bottom: 90px; right: 20px; width: 90px; height: 130px; object-fit: cover; border: 2px solid #00ff66; border-radius: 10px; z-index: 5; background: #222; }

        .call-controls { 
            position: relative; z-index: 6; display: flex; gap: 15px; margin-bottom: 25px; 
            background: rgba(0,0,0,0.7); padding: 12px; border-radius: 20px;
        }
        .ctrl-btn { background: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .ctrl-btn:focus { outline: 3px solid #00ff66; transform: scale(1.05); }
        .ctrl-btn.accept { background: #28a745; color: #fff; display: inline-block; }
        .ctrl-btn.hangup { background: #dc3545; color: #fff; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- হোম স্ক্রিন -->
        <div id="listScreen" class="screen">
            <div class="top-nav">
                <span>Direct Call</span>
                <!-- আইডি ড্রপডাউন -->
                <select id="userSelect" class="id-select" tabindex="1" onchange="changeUser()">
                    <option value="id1">আইডি ১ (হৃদয়)</option>
                    <option value="id2">আইডি ২ (রূপসী)</option>
                </select>
            </div>
            
            <div class="main-box">
                <p id="statusText" style="color: #8696a0; margin: 0; font-size: 14px;">স্ট্যাটাস: অনলাইন</p>
                <!-- কল করুন বাটন (কিবোর্ড ফোকাস টেস্টিংয়ের জন্য tabindex="2") -->
                <button class="call-action-btn" id="callBtn" tabindex="2" onclick="startCall()">📞 কল করুন</button>
            </div>
        </div>

        <!-- কল স্ক্রিন -->
        <div id="callScreen" class="screen call-screen hidden">
            <div style="z-index: 3; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; width: 100%;">
                <h3 id="callTitle" style="margin:0; color:#fff;">কল চলছে...</h3>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            
            <div class="call-controls">
                <button class="ctrl-btn accept" id="answerBtn" tabindex="1" onclick="answerCall()" style="display: none;">রিসিভ করুন</button>
                <button class="ctrl-btn hangup" id="hangupBtn" tabindex="2" onclick="endCall()">কেটে দিন</button>
            </div>
        </div>
    </div>

    <script>
        let peer, currentCall, localStream, incomingCallObj;
        let myId = "my_user_id_1";
        let targetId = "my_user_id_2";

        function changeUser() {
            const val = document.getElementById('userSelect').value;
            if (val === 'id1') {
                myId = "my_user_id_1";
                targetId = "my_user_id_2";
            } else {
                myId = "my_user_id_2";
                targetId = "my_user_id_1";
            }
            if (peer) peer.destroy();
            initPeer();
        }

        // পেজ লোড হওয়ার সাথে সাথে ড্রপডাউনে ফোকাস থাকবে, যেন কিবোর্ডের অ্যারো দিয়ে নিচে নামা যায়
        window.onload = () => { 
            changeUser(); 
            document.getElementById('userSelect').focus();
        };

        function initPeer() {
            peer = new Peer(myId, { host: '0.peerjs.com', port: 443, secure: true });

            peer.on('open', () => {
                document.getElementById('statusText').innerText = "স্ট্যাটাস: সংযুক্ত আছে";
            });

            peer.on('call', (call) => {
                incomingCallObj = call;
                document.getElementById('callScreen').classList.remove('hidden');
                document.getElementById('callTitle').innerText = "📞 কল এসেছে...";
                document.getElementById('answerBtn').style.display = 'inline-block';
                // কল আসলে রিসিভ বাটনে অটো ফোকাস হবে যাতে কিবোর্ডের এন্টার প্রেস করলেই রিসিভ হয়ে যায়
                document.getElementById('answerBtn').focus();
            });
        }

        async function startCall() {
            document.getElementById('callScreen').classList.remove('hidden');
            document.getElementById('callTitle').innerText = "কলিং হচ্ছে...";
            document.getElementById('answerBtn').style.display = 'none';
            document.getElementById('hangupBtn').focus(); // কল করার পর কেটে দিন বাটনে ফোকাস রাখব

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) {
                localStream = new MediaStream();
            }

            const call = peer.call(targetId, localStream);
            currentCall = call;
            setupCallEvents(call);
        }

        async function answerCall() {
            document.getElementById('answerBtn').style.display = 'none';
            document.getElementById('callTitle').innerText = "কথা চলছে...";
            document.getElementById('hangupBtn').focus();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) {
                localStream = new MediaStream();
            }

            incomingCallObj.answer(localStream);
            currentCall = incomingCallObj;
            setupCallEvents(currentCall);
        }

        function setupCallEvents(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('callTitle').innerText = "কথা চলছে...";
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
            call.on('close', () => { endCall(); });
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (incomingCallObj) incomingCallObj.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());

            document.getElementById('callScreen').classList.add('hidden');
            document.getElementById('userSelect').focus(); // কল কাটলে আবার আগের জায়গায় ফোকাস চলে আসবে
        }
    </script>
</body>
</html>
