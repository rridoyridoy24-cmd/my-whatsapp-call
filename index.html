<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat & Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b141a;
            color: #00ff66;
            font-family: sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .phone-frame {
            width: 100%; max-width: 380px; height: 100%; max-height: 700px;
            background-color: #121212; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,255,102,0.3);
            display: flex; flex-direction: column; overflow: hidden;
            border: 2px solid #00ff66; position: relative;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; background-color: #121212; z-index: 2;
        }

        .hidden { display: none !important; }

        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: #1f2c34; color: #fff; font-size: 15px; font-weight: bold;
        }

        .id-select {
            background: #2a3942; color: #00ff66; border: 1px solid #00ff66;
            padding: 5px 8px; border-radius: 6px; font-size: 13px; outline: none;
        }

        .chat-list { flex: 1; overflow-y: auto; background: #111b21; }

        .chat-item {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
        }
        .chat-item:focus, .chat-item:hover { background: rgba(0,255,102,0.2); outline: 2px solid #00ff66; }

        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px; background: #1f2c34; border-bottom: 1px solid rgba(0,255,102,0.3);
        }

        .action-btn {
            background: #005c4b; color: #fff; border: none; padding: 6px 12px;
            border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .action-btn:focus, .action-btn:hover { outline: 2px solid #fff; background: #007e66; }

        .chat-body {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px; background: #0b141a;
        }

        .bubble {
            background: #202c33; padding: 10px 14px; border-radius: 10px;
            max-width: 75%; align-self: flex-start; color: #e9edef; font-size: 14px; word-break: break-word;
        }
        .bubble.sent { background: #005c4b; align-self: flex-end; color: #fff; }

        .chat-footer {
            display: flex; align-items: center; gap: 6px; padding: 10px; background: #1f2c34;
        }
        .chat-footer input {
            flex: 1; background: #2a3942; border: none; border-radius: 8px;
            padding: 10px; color: #fff; outline: none; font-size: 14px;
        }
        .chat-footer input:focus { outline: 2px solid #00ff66; }

        .send-btn { background: #005c4b; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        .call-screen {
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 25px; text-align: center; position: absolute; z-index: 10; background: #000;
        }

        #remoteVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #localVideo { position: absolute; bottom: 90px; right: 20px; width: 90px; height: 130px; object-fit: cover; border: 2px solid #00ff66; border-radius: 10px; z-index: 5; background: #222; }

        .call-controls { 
            position: relative; z-index: 6; display: flex; gap: 15px; margin-bottom: 25px; 
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 20px;
        }
        .ctrl-btn { background: #fff; border: none; padding: 12px 22px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .ctrl-btn:focus { outline: 3px solid #00ff66; }
        .ctrl-btn.accept { background: #28a745; color: #fff; display: inline-block; }
        .ctrl-btn.hangup { background: #dc3545; color: #fff; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- হোম স্ক্রিন -->
        <div id="listScreen" class="screen">
            <div class="top-nav">
                <span>Simple App</span>
                <select id="userSelect" class="id-select" onchange="changeUser()">
                    <option value="id1">আইডি ১ (হৃদয়)</option>
                    <option value="id2">আইডি ২ (রূপসী)</option>
                </select>
            </div>
            <div class="chat-list">
                <div class="chat-item" tabindex="0" onclick="openChat()" id="partnerItem">
                    <h4 id="partnerName" style="margin:0; color:#fff; font-size:16px;">পার্টনার</h4>
                    <p style="margin:5px 0 0 0; font-size:12px; color:#8696a0;" id="statusText">অনলাইন হচ্ছে...</p>
                </div>
            </div>
        </div>

        <!-- চ্যাট স্ক্রিন -->
        <div id="chatScreen" class="screen hidden">
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="action-btn" tabindex="0" onclick="goBack()">←</button>
                    <h3 id="roomTitle" style="margin:0; font-size:14px; color:#fff;">পার্টনার</h3>
                </div>
                <div>
                    <button class="action-btn" tabindex="0" onclick="startCall()">📞 কল দিন</button>
                </div>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="bubble">চ্যাট শুরু হয়েছে। উপরের "কল দিন" বাটনে চাপ দিয়ে কথা বলুন।</div>
            </div>

            <div class="chat-footer">
                <input type="text" id="msgInput" placeholder="মেসেজ লিখুন..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="send-btn" tabindex="0" onclick="sendMsg()">পাঠান</button>
            </div>
        </div>

        <!-- কল স্ক্রিন -->
        <div id="callScreen" class="screen call-screen hidden">
            <div style="z-index: 3; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; width: 100%;">
                <h3 id="callTitle" style="margin:0; color:#fff;">কল চলছে...</h3>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            
            <div class="call-controls">
                <button class="ctrl-btn accept" id="answerBtn" tabindex="0" onclick="answerCall()" style="display: none;">রিসিভ করুন</button>
                <button class="ctrl-btn hangup" tabindex="0" onclick="endCall()">কেটে দিন</button>
            </div>
        </div>
    </div>

    <script>
        let peer, dataConn, currentCall, localStream, incomingCallObj;
        let myId = "my_user_id_1";
        let targetId = "my_user_id_2";

        function changeUser() {
            const val = document.getElementById('userSelect').value;
            if (val === 'id1') {
                myId = "my_user_id_1";
                targetId = "my_user_id_2";
                document.getElementById('partnerName').innerText = "রূপসী 💖";
                document.getElementById('roomTitle').innerText = "রূপসী 💖";
            } else {
                myId = "my_user_id_2";
                targetId = "my_user_id_1";
                document.getElementById('partnerName').innerText = "হৃদয় 💙";
                document.getElementById('roomTitle').innerText = "হৃদয় 💙";
            }
            if (peer) peer.destroy();
            initPeer();
        }

        window.onload = () => { 
            changeUser(); 
            document.getElementById('partnerItem').focus();
        };

        function initPeer() {
            peer = new Peer(myId, { host: '0.peerjs.com', port: 443, secure: true });

            peer.on('open', () => {
                document.getElementById('statusText').innerText = "অনলাইন আছে";
                connectData();
            });

            peer.on('connection', (conn) => {
                dataConn = conn;
                setupDataEvents();
            });

            peer.on('call', (call) => {
                incomingCallObj = call;
                document.getElementById('callScreen').classList.remove('hidden');
                document.getElementById('callTitle').innerText = "📞 কল এসেছে...";
                document.getElementById('answerBtn').style.display = 'inline-block';
                document.getElementById('answerBtn').focus();
            });
        }

        function connectData() {
            if (!dataConn || !dataConn.open) {
                dataConn = peer.connect(targetId);
                setupDataEvents();
            }
        }

        function setupDataEvents() {
            if (!dataConn) return;
            dataConn.on('data', (text) => {
                appendBubble(text, 'incoming');
            });
        }

        function openChat() {
            document.getElementById('listScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            connectData();
            document.getElementById('msgInput').focus();
        }

        function goBack() {
            document.getElementById('chatScreen').classList.add('hidden');
            document.getElementById('listScreen').classList.remove('hidden');
            document.getElementById('partnerItem').focus();
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            connectData();
            if (dataConn && dataConn.open) {
                dataConn.send(text);
            }
            appendBubble(text, 'sent');
            input.value = '';
        }

        function appendBubble(text, type) {
            const body = document.getElementById('chatBody');
            const div = document.createElement('div');
            div.className = 'bubble ' + (type === 'sent' ? 'sent' : '');
            div.innerText = text;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        async function startCall() {
            document.getElementById('callScreen').classList.remove('hidden');
            document.getElementById('callTitle').innerText = "কলিং হচ্ছে...";
            document.getElementById('answerBtn').style.display = 'none';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) {
                localStream = new MediaStream();
            }

            const call = peer.call(targetId, localStream);
            currentCall = call;
            setupCallEvents(call);
        }

        async function answerCall() {
            document.getElementById('answerBtn').style.display = 'none';
            document.getElementById('callTitle').innerText = "কথা চলছে...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch(e) {
                localStream = new MediaStream();
            }

            incomingCallObj.answer(localStream);
            currentCall = incomingCallObj;
            setupCallEvents(currentCall);
        }

        function setupCallEvents(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('callTitle').innerText = "কথা চলছে...";
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
            call.on('close', () => { endCall(); });
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (incomingCallObj) incomingCallObj.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());

            document.getElementById('callScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
