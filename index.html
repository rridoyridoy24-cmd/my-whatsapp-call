<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp & Advanced Hybrid Navigation System</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050805;
            color: #00ff66;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* থিম ভ্যারিয়েবল */
        body.dark-theme {
            --bg-main: #121212;
            --nav-bg: #1f2c34;
            --chat-bg: #0b141a;
            --list-bg: #111b21;
            --text-color: #e9edef;
            --bubble-recv: #202c33;
            --footer-bg: #1f2c34;
        }
        body.light-theme {
            --bg-main: #f0f2f5;
            --nav-bg: #00a884;
            --chat-bg: #efeae2;
            --list-bg: #ffffff;
            --text-color: #111b21;
            --bubble-recv: #ffffff;
            --footer-bg: #f0f2f5;
        }

        #virtualCursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #00ff66 40%, transparent 70%);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ff66;
            transition: transform 0.05s linear;
            display: none; 
        }

        .phone-frame {
            width: 100%;
            max-width: 380px;
            height: 100%;
            max-height: 700px;
            background-color: var(--bg-main, #121212);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,255,102,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #00ff66;
            position: relative;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main, #121212);
            z-index: 2;
        }

        .hidden { display: none !important; }
        .screen-hidden * { opacity: 0 !important; }
        .screen-hidden { background: #000 !important; }

        .whatsapp-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--nav-bg, #1f2c34);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        .id-switcher-select {
            background: #2a3942;
            color: #fff;
            border: 1px solid #00ff66;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            background: var(--list-bg, #111b21);
        }

        .chat-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .chat-list-item:hover, .chat-list-item.focused { background: rgba(0,255,102,0.2); }

        .chat-list-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-list-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-list-info h4 { margin: 0; font-size: 16px; color: var(--text-color, #e9edef); }
        .chat-list-info p { margin: 4px 0 0 0; font-size: 13px; color: #8696a0; }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: var(--nav-bg, #1f2c34);
            border-bottom: 1px solid rgba(0,255,102,0.3);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header-left img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-header-left h3 { margin: 0; font-size: 15px; color: var(--text-color, #e9edef); }
        .chat-header-left p { margin: 0; font-size: 11px; color: #00ff66; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .header-icon-btn svg { width: 20px; height: 20px; fill: #aebac1; }
        .header-icon-btn:hover, .header-icon-btn.focused { background: rgba(0,255,102,0.3); }
        .header-icon-btn:hover svg { fill: #fff; }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--chat-bg, #0b141a);
        }

        .message-bubble {
            background: var(--bubble-recv, #202c33);
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            align-self: flex-start;
            color: var(--text-color, #e9edef);
            font-size: 14px;
            position: relative;
            word-break: break-word;
        }
        .message-bubble.sent { background: #005c4b; align-self: flex-end; color: #fff; }
        .msg-status { font-size: 10px; color: #53bdeb; float: right; margin-left: 5px; margin-top: 4px; }

        .delete-btn {
            background: none; border: none; color: #ff4d4d; font-size: 11px; cursor: pointer;
            display: block; margin-top: 4px; padding: 0; text-align: right; width: 100%;
        }
        .delete-btn:hover { text-decoration: underline; }

        .emoji-picker {
            position: absolute; bottom: 65px; left: 10px; background: var(--nav-bg, #1f2c34);
            border: 1px solid #2a3942; border-radius: 10px; padding: 8px; display: flex; gap: 5px; z-index: 10;
        }
        .emoji-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px; }

        .chat-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 12px;
            background: var(--footer-bg, #1f2c34);
            position: relative;
        }

        .chat-footer input[type="text"] {
            flex: 1;
            background: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .file-upload-label {
            cursor: pointer; background: #2a3942; padding: 7px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .file-upload-label svg { width: 18px; height: 18px; fill: #00ff66; }

        .video-call-screen, .audio-call-screen {
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
            position: absolute;
            z-index: 10;
        }
        .video-call-screen { background: #000; }

        .call-top-info {
            z-index: 3;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .call-top-info h3 { margin: 0; font-size: 16px; color: #fff; }
        .call-status-text { font-size: 13px; color: #00ff66; margin-top: 2px; }

        #fullScreenVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; display: flex; justify-content: center; align-items: center;
        }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        
        #localVideo {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 90px;
            height: 130px;
            object-fit: cover;
            border: 2px solid #00ff66;
            border-radius: 10px;
            z-index: 5;
            background: #222;
        }

        .call-controls-bar {
            position: relative; z-index: 6; display: flex; justify-content: space-around;
            align-items: center; background: rgba(20, 20, 20, 0.85); width: 100%;
            padding: 12px 10px; border-radius: 30px; margin-bottom: 10px;
        }

        .call-ctrl-btn {
            background: rgba(255, 255, 255, 0.15); border: none; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .call-ctrl-btn.active { background: #fff; }
        .call-ctrl-btn.active svg { fill: #000; }
        .call-ctrl-btn svg { width: 20px; height: 20px; fill: #fff; }
        .call-ctrl-btn.btn-hangup { background-color: #dc3545; }
        .call-ctrl-btn.btn-answer { background-color: #28a745; }

        .audio-profile-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;
        }
        .audio-profile-img {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.1);
        }

        .info-bar {
            background: var(--nav-bg, #1f2c34); padding: 6px; font-size: 11px; color: #8696a0; text-align: center; display: flex; justify-content: space-around; align-items: center;
        }

        /* প্রোগ্রেস বার স্টাইল */
        .progress-container {
            width: 100%; background: rgba(255,255,255,0.2); border-radius: 4px; height: 6px; margin-top: 5px; overflow: hidden;
        }
        .progress-bar {
            width: 0%; height: 100%; background: #00ff66; transition: width 0.2s;
        }
    </style>
</head>
<body class="dark-theme">

    <script>
        let audioCtx = null;
        let ringInterval = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNotificationSound() {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function startRingingTone() {
            stopRingingTone();
            ringInterval = setInterval(() => {
                try {
                    initAudioContext();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } catch(e) {}
            }, 1200);
        }

        function stopRingingTone() {
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
        }

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        const cursorSpeed = 15;
        const cursor = document.getElementById('virtualCursor');
        let isButtonPhoneMode = false;

        function updateCursorPos() {
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
        }
        updateCursorPos();

        document.addEventListener('keydown', (e) => {
            initAudioContext();
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
                if (!isButtonPhoneMode) {
                    isButtonPhoneMode = true;
                    cursor.style.display = 'block';
                }
            }

            if (e.key === 'ArrowUp') { cursorY = Math.max(0, cursorY - cursorSpeed); e.preventDefault(); }
            else if (e.key === 'ArrowDown') { cursorY = Math.min(window.innerHeight, cursorY + cursorSpeed); e.preventDefault(); }
            else if (e.key === 'ArrowLeft') { cursorX = Math.max(0, cursorX - cursorSpeed); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { cursorX = Math.min(window.innerWidth, cursorX + cursorSpeed); e.preventDefault(); }
            else if (e.key === 'Enter' || e.key === ' ') {
                const elementUnderCursor = document.elementFromPoint(cursorX, cursorY);
                if (elementUnderCursor) {
                    elementUnderCursor.click();
                    if(elementUnderCursor.tagName === 'INPUT') { elementUnderCursor.focus(); }
                }
                e.preventDefault();
            } else if (e.key === '*' || e.key === 'Shift') {
                document.getElementById('phoneBox').classList.toggle('screen-hidden');
            }
            updateCursorPos();
        });

        document.addEventListener('click', () => { initAudioContext(); });

        let peer;
        let myId = "phone_user_1";
        let targetPeerId = "phone_user_2";

        // আইডি সুইচ লজিক (হৃদয় ও রূপসী)
        function changeActiveUserIdentity() {
            const selectVal = document.getElementById('userSwitchSelect').value;
            if (selectVal === 'hridoy') {
                myId = "phone_user_1";
                targetPeerId = "phone_user_2";
                document.getElementById('chatPartnerName').innerText = "রূপসী 💖";
                document.getElementById('roomPartnerTitle').innerText = "রূপসী 💖";
                if(videoCallPartnerName) document.getElementById('videoCallPartnerName').innerText = "রূপসী 💖";
                if(audioCallPartnerName) document.getElementById('audioCallPartnerName').innerText = "রূপসী 💖";
            } else {
                myId = "phone_user_2";
                targetPeerId = "phone_user_1";
                document.getElementById('chatPartnerName').innerText = "হৃদয় 💙";
                document.getElementById('roomPartnerTitle').innerText = "হৃদয় 💙";
                if(videoCallPartnerName) document.getElementById('videoCallPartnerName').innerText = "হৃদয় 💙";
                if(audioCallPartnerName) document.getElementById('audioCallPartnerName').innerText = "হৃদয় 💙";
            }
            if (peer) {
                peer.destroy();
            }
            initPeer();
        }

        let currentCall = null;
        let dataConn = null;
        let localStream = null;
        let incomingCallObj = null;
        let isMuted = false;
        let isSpeakerOn = false;
        let isVideoOff = false;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordingInterval = null;
        let recordingSeconds = 0;
        let typingTimeout;

        function initPeer() {
            peer = new Peer(myId, {
                config: {
                    'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { stun: 'stun1.l.google.com:19302' }
                    ]
                }
            });
            peer.on('open', (id) => { 
                updateConnectionStatus("Connected", "#00ff66");
                connectDataChannel(); 
            });
            peer.on('connection', (conn) => {
                dataConn = conn;
                setupDataConnectionEvents();
                updateConnectionStatus("Connected", "#00ff66");
            });
            peer.on('call', (call) => {
                incomingCallObj = call;
                startRingingTone();
                document.getElementById('imoListScreen').classList.add('hidden');
                document.getElementById('chatRoomScreen').classList.add('hidden');
                document.getElementById('videoCallScreen').classList.add('hidden');
                document.getElementById('audioCallScreen').classList.remove('hidden');
                document.getElementById('audioCallStatus').innerText = "Incoming Call...";
                document.getElementById('answerBtn').classList.remove('hidden');
            });
        }

        window.onload = () => { changeActiveUserIdentity(); };

        function updateConnectionStatus(statusText, color) {
            const bar = document.getElementById('deviceIdBar');
            const roomStatus = document.getElementById('roomOnlineStatus');
            const lastSeen = document.getElementById('lastSeenText');
            if(bar) bar.innerText = `স্ট্যাটাস: ${statusText} | ID: ${myId}`;
            if(roomStatus) {
                roomStatus.innerText = statusText === "Connected" ? "Online" : "Disconnected";
                roomStatus.style.color = color;
            }
            if(lastSeen) {
                lastSeen.innerText = statusText === "Connected" ? "Active" : "Last seen recently";
            }
        }

        function connectDataChannel() {
            if (!dataConn || dataConn.open === false) {
                dataConn = peer.connect(targetPeerId);
                setupDataConnectionEvents();
            }
        }

        function setupDataConnectionEvents() {
            if (!dataConn) return;
            dataConn.on('open', () => { updateConnectionStatus("Connected", "#00ff66"); });
            dataConn.on('close', () => { updateConnectionStatus("Disconnected", "#ff4d4d"); });
            dataConn.on('data', (data) => {
                if (data.type === 'text') {
                    playNotificationSound();
                    appendMessage(data.content, 'incoming', 'text', data.msgId);
                } else if (data.type === 'media-file') {
                    playNotificationSound();
                    appendMessage(data.content, 'incoming', data.fileType, data.msgId);
                } else if (data.type === 'voice-msg') {
                    playNotificationSound();
                    appendMessage(data.content, 'incoming', 'voice-msg', data.msgId);
                } else if (data.type === 'delete-msg') {
                    removeMessageElement(data.msgId);
                } else if (data.type === 'read-receipt') {
                    updateTicksToRead();
                } else if (data.type === 'reaction') {
                    applyReactionToMessage(data.msgId, data.emoji);
                } else if (data.type === 'typing-start') {
                    document.getElementById('roomOnlineStatus').innerText = "টাইপ করছে...";
                    document.getElementById('typingIndicatorPreview').innerText = "টাইপ করছে...";
                } else if (data.type === 'typing-stop') {
                    document.getElementById('roomOnlineStatus').innerText = "Online";
                    document.getElementById('typingIndicatorPreview').innerText = "টাচ ও বাটন ফোন সাপোর্ট";
                }
            });
        }

        function openChatScreen() {
            document.getElementById('imoListScreen').classList.add('hidden');
            document.getElementById('chatRoomScreen').classList.remove('hidden');
            connectDataChannel();
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'read-receipt' });
            }
        }

        function goBackToList() {
            document.getElementById('chatRoomScreen').classList.add('hidden');
            document.getElementById('imoListScreen').classList.remove('hidden');
        }

        function toggleEmojiPicker() {
            document.getElementById('emojiPickerPanel').classList.toggle('hidden');
        }

        function addEmoji(emoji) {
            const input = document.getElementById('chatInputBox');
            input.value += emoji;
            document.getElementById('emojiPickerPanel').classList.add('hidden');
            input.focus();
        }

        function toggleTheme() {
            if(document.body.classList.contains('dark-theme')) {
                document.body.classList.replace('dark-theme', 'light-theme');
            } else {
                document.body.classList.replace('light-theme', 'dark-theme');
            }
        }

        function handleTypingEvent() {
            connectDataChannel();
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'typing-start' });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    dataConn.send({ type: 'typing-stop' });
                }, 1500);
            }
        }

        function sendTextMessage() {
            const input = document.getElementById('chatInputBox');
            const text = input.value.trim();
            if (!text) return;

            const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
            connectDataChannel();
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'text', content: text, msgId: msgId });
                dataConn.send({ type: 'typing-stop' });
            }
            appendMessage(text, 'sent', 'text', msgId);
            input.value = '';
        }

        function handleChatInput(e) {
            if (e.key === 'Enter') { sendTextMessage(); }
        }

        // ছবি বা ভিডিও প্রোগ্রেস বারসহ আপলোড
        function sendMediaFile(input) {
            const file = input.files[0];
            if (!file) return;

            const fileType = file.type.startsWith('image') ? 'image-file' : 'video-file';
            const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
            
            appendMessageWithProgress("", 'sent', fileType, msgId);

            const reader = new FileReader();
            reader.onprogress = function(event) {
                if (event.lengthComputable) {
                    let percentLoaded = Math.round((event.loaded / event.total) * 100);
                    updateProgressBar(msgId, percentLoaded);
                }
            };
            
            reader.onload = function(e) {
                const base64Data = e.target.result;
                updateProgressBar(msgId, 100);
                setTimeout(() => { finalizeMediaMessage(msgId, base64Data, fileType); }, 400);
            };
            reader.readAsDataURL(file);
        }

        function appendMessageWithProgress(content, type, msgType, msgId) {
            const chatBody = document.getElementById('chatBodyContainer');
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            bubble.id = msgId;
            if (type === 'sent') bubble.classList.add('sent');

            let innerHtml = `
                <div style="margin-bottom: 4px;"><span style="color: #00ff66; font-size: 12px;">📁 ফাইল আপলোড হচ্ছে...</span></div>
                <div class="progress-container"><div class="progress-bar" id="prog_${msgId}"></div></div>
            `;
            bubble.innerHTML = innerHtml;
            chatBody.appendChild(bubble);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function updateProgressBar(msgId, percent) {
            const bar = document.getElementById(`prog_${msgId}`);
            if(bar) bar.style.width = percent + '%';
        }

        function finalizeMediaMessage(msgId, content, fileType) {
            const bubble = document.getElementById(msgId);
            if(!bubble) return;

            let innerHtml = '';
            if (fileType === 'image-file') {
                innerHtml = `<div style="margin-bottom: 4px;"><span style="color: #00ff66; font-size: 12px;">📷 ছবি:</span></div><img src="${content}" style="max-width: 100%; border-radius: 8px;">`;
            } else {
                innerHtml = `<div style="margin-bottom: 4px;"><span style="color: #00ff66; font-size: 12px;">📹 ভিডিও:</span></div><video src="${content}" controls style="max-width: 100%; border-radius: 8px;"></video>`;
            }

            innerHtml += `<div class="msg-reaction-container" id="react_${msgId}" style="font-size: 14px; margin-top: 2px;"></div>`;
            innerHtml += `<span class="msg-status" id="msgTick">✓</span>`;
            innerHtml += `<button class="delete-btn" onclick="deleteMessage('${msgId}')">ডিলিট করুন</button>`;
            
            bubble.innerHTML = innerHtml;

            connectDataChannel();
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'media-file', content: content, fileType: fileType, msgId: msgId });
            }
        }

        // ভয়েস নোট লাইভ রেকর্ডিং টাইমারসহ ফাংশন
        async function startVoiceRecording() {
            const btn = document.getElementById('voiceRecordBtn');
            const timerEl = document.getElementById('recordingTimer');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const base64Audio = e.target.result;
                            const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
                            connectDataChannel();
                            if (dataConn && dataConn.open) {
                                dataConn.send({ type: 'voice-msg', content: base64Audio, msgId: msgId });
                            }
                            appendMessage(base64Audio, 'sent', 'voice-msg', msgId);
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.backgroundColor = "#ff4d4d";
                    
                    recordingSeconds = 0;
                    timerEl.style.display = 'inline';
                    timerEl.innerText = "0:00";
                    recordingInterval = setInterval(() => {
                        recordingSeconds++;
                        let mins = Math.floor(recordingSeconds / 60);
                        let secs = recordingSeconds % 60;
                        timerEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    }, 1000);

                } catch (err) {
                    alert("মাইক্রোফোন অ্যাক্সেস পাওয়া যায়নি!");
                }
            }
        }

        function stopVoiceRecording() {
            const btn = document.getElementById('voiceRecordBtn');
            const timerEl = document.getElementById('recordingTimer');

            if (isRecording && mediaRecorder) {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.backgroundColor = "";
                clearInterval(recordingInterval);
                timerEl.style.display = 'none';
            }
        }

        function appendMessage(content, type, msgType, msgId) {
            const chatBody = document.getElementById('chatBodyContainer');
            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            bubble.id = msgId || ('msg_' + Date.now());
            if (type === 'sent') bubble.classList.add('sent');

            let innerHtml = '';
            if (msgType === 'image-file') {
                innerHtml = `<div style="margin-bottom: 4px;"><span style="color: #00ff66; font-size: 12px;">📷 ছবি:</span></div><img src="${content}" style="max-width: 100%; border-radius: 8px;">`;
            } else if (msgType === 'video-file') {
                innerHtml = `<div style="margin-bottom: 4px;"><span style="color: #00ff66; font-size: 12px;">📹 ভিডিও:</span></div><video src="${content}" controls style="max-width: 100%; border-radius: 8px;"></video>`;
            } else if (msgType === 'voice-msg') {
                innerHtml = `<div style="margin-bottom: 4px;"><span style="color: #00ff66; font-size: 12px;">🎤 ভয়েস মেসেজ</span></div><audio src="${content}" controls style="width: 200px; height: 35px;"></audio>`;
            } else {
                innerHtml = `${content}`;
            }

            innerHtml += `<div class="msg-reaction-container" id="react_${bubble.id}" style="font-size: 14px; margin-top: 2px;"></div>`;
            if (type === 'sent') innerHtml += `<span class="msg-status" id="msgTick">✓</span>`;
            
            bubble.ondblclick = () => {
                const reactionEmoji = prompt("একটি ইমোজি রিঅ্যাকশন দিন (যেমন: ❤️, 👍, 😂):", "❤️");
                if(reactionEmoji) {
                    applyReactionToMessage(bubble.id, reactionEmoji);
                    connectDataChannel();
                    if(dataConn && dataConn.open) {
                        dataConn.send({ type: 'reaction', msgId: bubble.id, emoji: reactionEmoji });
                    }
                }
            };

            innerHtml += `<button class="delete-btn" onclick="deleteMessage('${bubble.id}')">ডিলিট করুন</button>`;
            bubble.innerHTML = innerHtml;

            chatBody.appendChild(bubble);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function applyReactionToMessage(msgId, emoji) {
            const container = document.getElementById(`react_${msgId}`);
            if(container) {
                container.innerHTML = `<span style="background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; font-size: 12px;">${emoji}</span>`;
            }
        }

        function deleteMessage(msgId) {
            removeMessageElement(msgId);
            connectDataChannel();
            if (dataConn && dataConn.open) {
                dataConn.send({ type: 'delete-msg', msgId: msgId });
            }
        }

        function removeMessageElement(msgId) {
            const el = document.getElementById(msgId);
            if (el) {
                el.innerHTML = "<i style='color: #8696a0; font-size: 12px;'>এই মেসেজটি ডিলিট করা হয়েছে</i>";
                setTimeout(() => el.remove(), 2000);
            }
        }

        function updateTicksToRead() {
            const tick = document.getElementById('msgTick');
            if (tick) {
                tick.innerText = "✓✓";
                tick.style.color = "#53bdeb";
            }
        }

        async function startCall(type) {
            document.getElementById('imoListScreen').classList.add('hidden');
            document.getElementById('chatRoomScreen').classList.add('hidden');
            startRingingTone();
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
                if(type === 'video') {
                    const localVidEl = document.getElementById('localVideo');
                    localVidEl.srcObject = localStream;
                }
            } catch (e) {
                localStream = new MediaStream();
            }

            if (type === 'video') {
                document.getElementById('videoCallScreen').classList.remove('hidden');
                document.getElementById('audioCallScreen').classList.add('hidden');
                document.getElementById('videoCallStatus').innerText = "Ringing...";
            } else {
                document.getElementById('audioCallScreen').classList.remove('hidden');
                document.getElementById('videoCallScreen').classList.add('hidden');
                document.getElementById('audioCallStatus').innerText = "Ringing...";
                document.getElementById('answerBtn').classList.add('hidden');
            }

            try {
                const call = peer.call(targetPeerId, localStream);
                if (call) {
                    currentCall = call;
                    setupCallEvents(call, type);
                }
            } catch (err) {}
        }

        async function answerIncomingCall() {
            stopRingingTone();
            if (!incomingCallObj) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const localVidEl = document.getElementById('localVideo');
                localVidEl.srcObject = localStream;
            } catch (e) {
                localStream = new MediaStream();
            }

            incomingCallObj.answer(localStream);
            currentCall = incomingCallObj;
            
            document.getElementById('audioCallScreen').classList.add('hidden');
            document.getElementById('videoCallScreen').classList.remove('hidden');
            document.getElementById('videoCallStatus').innerText = "Connected";
            document.getElementById('answerBtn').classList.add('hidden');
            
            setupCallEvents(currentCall, 'video');
        }

        function setupCallEvents(call, type) {
            call.on('stream', (remoteStream) => {
                stopRingingTone();
                if (type === 'video') {
                    document.getElementById('videoCallStatus').innerText = "Connected";
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                } else {
                    document.getElementById('audioCallStatus').innerText = "Connected";
                }
            });
            call.on('close', () => { endCall(); });
        }

        function toggleMute() {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
                document.getElementById('vidMuteBtn').classList.toggle('active', isMuted);
                document.getElementById('audMuteBtn').classList.toggle('active', isMuted);
            }
        }

        function toggleVideo() {
            if (localStream) {
                isVideoOff = !isVideoOff;
                localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
            }
        }

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            document.getElementById('audSpkBtn').classList.toggle('active', isSpeakerOn);
        }

        function switchCamera() {
            alert("ক্যামেরা সুইচিং সচল আছে!");
        }

        function endCall() {
            stopRingingTone();
            if (currentCall) currentCall.close();
            if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; }
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            
            document.getElementById('videoCallScreen').classList.add('hidden');
            document.getElementById('audioCallScreen').classList.add('hidden');
            document.getElementById('chatRoomScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
